---
- name: Check SSL expiry (clean plain output)
  hosts: localhost
  gather_facts: no

  vars:
    sites:
      - awx.aravind.org
      - google.com

  tasks:
    - name: Check SSL expiry and get days left
      shell: |
        end=$(echo | openssl s_client -servername {{ item }} -connect {{ item }}:443 2>/dev/null \
              | openssl x509 -noout -enddate | cut -d= -f2)
        end_seconds=$(date -d "$end" +%s)
        now_seconds=$(date +%s)
        days_left=$(( (end_seconds - now_seconds) / 86400 ))
        echo "{{ item }}: ${days_left} days left"
      register: result
      loop: "{{ sites }}"
      changed_when: false

    - name: Combine into single clean output
      set_fact:
        final_report: |
          SSL Expiry Report
          -----------------
          {% for r in result.results %}
          {{ r.stdout }}
          {% endfor %}

    - name: Print final clean output only
      debug:
        msg: "{{ final_report }}"

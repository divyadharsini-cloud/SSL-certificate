---
- name: Check SSL expiry (always send report email)
  hosts: localhost
  gather_facts: no

  vars:
    sites:
      - google.com
      - awx.aravind.org
      - elk-stack.aravind.org
      - uatredcap.aravind.org
    warn_days: 30
    notification_recipients: "divyadharsini@aravind.org,srinisudhan.balaji@aravind.org"

  tasks:
    - name: Fetch certificate expiry details safely
      shell: |
        set -o pipefail
        OUT="$(echo | openssl s_client -servername {{ item }} -connect {{ item }}:443 2>/dev/null || true)"
        if ! echo "$OUT" | grep -q "BEGIN CERTIFICATE"; then
          echo "{{ item }}|ERROR|Connection failed or no certificate received"
          exit 0
        fi

        END=$(echo "$OUT" | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
        if [ -z "$END" ]; then
          echo "{{ item }}|ERROR|Could not extract enddate"
          exit 0
        fi

        end_ts=$(date -d "$END" +%s 2>/dev/null || date -j -f "%b %e %T %Y %Z" "$END" +%s 2>/dev/null)
        if [ -z "$end_ts" ]; then
          echo "{{ item }}|ERROR|Unrecognized date format: $END"
          exit 0
        fi

        now=$(date +%s)
        days=$(( (end_ts - now) / 86400 ))
        echo "{{ item }}|OK|${days}|${END}"
      register: ssl_raw
      loop: "{{ sites }}"
      changed_when: false

    - name: Build SSL report
      set_fact:
        final_report: |
          SSL Expiry Report
          -----------------
          {% for r in ssl_raw.results %}
          {% set p = r.stdout.split('|') %}
          {% if p[1] == 'OK' %}
          {{ p[0] }}: {{ p[2] }} days left (expires: {{ p[3] }})
          {% else %}
          {{ p[0] }}: ERROR - {{ p[2] }}
          {% endif %}
          {% endfor %}
        expiring_sites: |
          {% for r in ssl_raw.results %}
          {% set p = r.stdout.split('|') %}
          {% if p[1] == 'OK' and (p[2]|int) < warn_days %}
          {{ p[0] }}: {{ p[2] }} days left
          {% elif p[1] == 'ERROR' %}
          {{ p[0] }}: {{ p[2] }}
          {% endif %}
          {% endfor %}

    - name: Show final report
      debug:
        var: final_report

    - name: Always send SSL report email
      community.general.mail:
        host: smtp.gmail.com
        port: 587
        secure: starttls
        username: "{{ lookup('env','EMAIL_USER') }}"
        password: "{{ lookup('env','EMAIL_PASSWORD') }}"
        to: "{{ notification_recipients }}"
        from: "{{ lookup('env','EMAIL_USER') }}"
        subject: "SSL Certificate Health Report"
        body: |
          Hello Team,

          {% if expiring_sites | trim == "" %}
          ✅ All certificates are valid and above {{ warn_days }} days from expiry.
          {% else %}
          ⚠️ The following SSL certificates require attention:

          {{ expiring_sites | trim }}
          {% endif %}

          Full SSL Report:
          {{ final_report }}

          Regards,
          SSL Monitoring System

---
- name: Check SSL expiry (with email alert)
  hosts: localhost
  gather_facts: no

  vars:
    sites:
      - google.com
      - awx.aravind.org
      - uatredcap.aravind.org
      - elk-stack.aravind.org
    warn_days: 30
    notification_recipients: "divyadharsini@aravind.org,karthikeyan.sudhakar@aravind.org,srinisudhan.balaji@aravind.org"

  tasks:
    - name: Check SSL expiry and get days left
      shell: |
        end=$(echo | openssl s_client -servername {{ item }} -connect {{ item }}:443 2>/dev/null \
              | openssl x509 -noout -enddate | cut -d= -f2)
        end_seconds=$(date -d "$end" +%s)
        now_seconds=$(date +%s)
        days_left=$(( (end_seconds - now_seconds) / 86400 ))
        echo "{{ item }}: ${days_left}"
      register: result
      loop: "{{ sites }}"
      changed_when: false

    - name: Build full report for logging / dashboard
      set_fact:
        final_report: |
          SSL Expiry Report
          -----------------
          {% for r in result.results %}
          {{ r.stdout.split(':')[0] }}: {{ r.stdout.split(':')[1] | trim }} days left
          {% endfor %}

    - name: Extract only sites that are below threshold
      set_fact:
        expiring_sites: |
          {% for r in result.results %}
          {% set days = r.stdout.split(':')[1] | int %}
          {% if days < warn_days %}
          {{ r.stdout.split(':')[0] }}: {{ days }} days left
          {% endif %}
          {% endfor %}

    - name: Display final report (readable multi-line)
      debug:
        var: final_report

    - name: Send SSL expiry alert email if any site is below threshold
      run_once: true
      delegate_to: localhost
      community.general.mail:
        host: smtp.gmail.com
        port: 587
        secure: starttls
        username: "{{ lookup('env', 'EMAIL_USER') }}"
        password: "{{ lookup('env', 'EMAIL_PASSWORD') }}"
        to: "{{ notification_recipients }}"
        from: "{{ lookup('env', 'EMAIL_USER') }}"
        subject: "⚠️ SSL Certificate Expiry Alert"
        body: |
          Hello Team,

          The following SSL certificates are nearing expiry (less than {{ warn_days }} days):

          {{ expiring_sites }}

          Full SSL Scan Report:
          {{ final_report }}

          Regards,
          🔐 SSL Monitoring via AWX
      when: expiring_sites | trim | length > 0
